<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopVN - Đăng ký tài khoản</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 20px;
            color: #333;
        }

        /* Container bao ngoài tạo thẻ khung như trong ảnh */
        .form-card {
            max-width: 550px;
            margin: 0 auto;
            background-color: #fff;
            padding: 25px 30px;
            border-radius: 6px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.15);
            border: 1px solid #ddd;
        }

        h1 {
            text-align: center;
            font-size: 20px;
            margin-top: 0;
            margin-bottom: 20px;
            color: #222;
        }

        /* Styling fieldset & legend */
        fieldset {
            border: 1px solid #ccc;
            border-radius: 4px;
            padding: 12px 15px 15px 15px;
            margin-bottom: 18px;
            background-color: #fff;
        }

        legend {
            font-weight: bold;
            font-size: 13px;
            padding: 0 5px;
            color: #444;
        }

        /* Form Row Layout */
        .form-group {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
            font-size: 13px;
        }

        .form-group:last-child {
            margin-bottom: 0;
        }

        .form-group label {
            width: 150px;
            flex-shrink: 0;
            color: #333;
        }

        /* Dynamic input sizing */
        .form-group input[type="text"],
        .form-group input[type="email"],
        .form-group input[type="password"],
        .form-group input[type="tel"],
        .form-group input[type="url"],
        .form-group input[type="search"],
        .form-group input[type="number"],
        .form-group input[type="date"] {
            flex: 1;
            padding: 5px 8px;
            border: 1px solid #ccc;
            border-radius: 3px;
            font-size: 13px;
            box-sizing: border-box;
        }

        /* Styling riêng cho từng loại input đặc thù */
        input[type="color"] {
            width: 40px;
            height: 25px;
            border: 1px solid #ccc;
            padding: 0;
            cursor: pointer;
            background: none;
        }

        input[type="range"] {
            flex: 1;
        }

        .radio-group, .checkbox-group {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .radio-group label, .checkbox-group label {
            width: auto;
            display: flex;
            align-items: center;
            gap: 3px;
            cursor: pointer;
        }

        /* Group nút Submit & Reset */
        .button-group {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
        }

        input[type="submit"] {
            background-color: #337ab7;
            color: #fff;
            border: 1px solid #2e6da4;
            padding: 7px 18px;
            border-radius: 4px;
            font-size: 13px;
            cursor: pointer;
        }

        input[type="submit"]:hover {
            background-color: #286090;
        }

        input[type="reset"] {
            background-color: #6c757d;
            color: #fff;
            border: 1px solid #5a6268;
            padding: 7px 18px;
            border-radius: 4px;
            font-size: 13px;
            cursor: pointer;
        }

        input[type="reset"]:hover {
            background-color: #5a6268;
        }
    </style>
</head>
<body>

    <main>
        <section class="form-card">
            <h1>Đăng ký tài khoản mới</h1>

            <form action="xu_ly_dangky.php" method="POST" enctype="multipart/form-data" name="formDangKy" id="formDangKy">
                
                <!-- Fieldset 1: Thông tin cơ bản -->
                <fieldset>
                    <legend>Thông tin cơ bản</legend>

                    <div class="form-group">
                        <label for="hoten">Họ và tên:</label>
                        <input type="text" name="hoten" id="hoten" placeholder="Nguyễn Văn An" required maxlength="100">
                    </div>

                    <div class="form-group">
                        <label for="email">Email:</label>
                        <input type="email" name="email" id="email" placeholder="example@gmail.com" required>
                    </div>

                    <div class="form-group">
                        <label for="matkhau">Mật khẩu:</label>
                        <input type="password" name="matkhau" id="matkhau" minlength="8" required placeholder="••••••••">
                    </div>

                    <div class="form-group">
                        <label for="sdt">Số điện thoại:</label>
                        <input type="tel" name="sdt" id="sdt" pattern="[0-9]{10}" placeholder="0901234567">
                    </div>
                </fieldset>

                <!-- Fieldset 2: Thông tin cá nhân -->
                <fieldset>
                    <legend>Thông tin cá nhân</legend>

                    <div class="form-group">
                        <label for="tuoi">Tuổi:</label>
                        <input type="number" name="tuoi" id="tuoi" min="16" max="99" step="1" value="18">
                    </div>

                    <div class="form-group">
                        <label for="ngaysinh">Ngày sinh:</label>
                        <input type="date" name="ngaysinh" id="ngaysinh" min="1950-01-01" max="2010-12-31" value="2005-01-01">
                    </div>

                    <div class="form-group">
                        <label>Giới tính:</label>
                        <div class="radio-group">
                            <label><input type="radio" name="gioitinh" value="nam" checked> Nam</label>
                            <label><input type="radio" name="gioitinh" value="nu"> Nữ</label>
                            <label><input type="radio" name="gioitinh" value="khac"> Khác</label>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="mauua">Màu yêu thích:</label>
                        <input type="color" name="mauua" id="mauua" value="#FF6B6B">
                    </div>
                </fieldset>

                <!-- Fieldset 3: Sở thích & Cài đặt -->
                <fieldset>
                    <legend>Sở thích &amp; Cài đặt</legend>

                    <div class="form-group">
                        <label for="soikim">Tìm kiếm sở thích:</label>
                        <input type="search" name="soikim" id="soikim" placeholder="Ví dụ: đọc sách, chơi game...">
                    </div>

                    <div class="form-group">
                        <label for="chitieu">Mức chi tiêu/tháng (VNĐ):</label>
                        <input type="range" name="chitieu" id="chitieu" min="0" max="50000000" step="500000" value="5000000">
                    </div>

                    <div class="form-group">
                        <label>Sở thích (chọn nhiều):</label>
                        <div class="checkbox-group">
                            <label><input type="checkbox" name="st_docsinh" value="doc" checked> Đọc sách</label>
                            <label><input type="checkbox" name="st_game" value="game"> Chơi game</label>
                            <label><input type="checkbox" name="st_du_lich" value="dulich"> Du lịch</label>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="website">Website cá nhân:</label>
                        <input type="url" name="website" id="website" placeholder="https://example.com">
                    </div>

                    <div class="form-group">
                        <label for="avatar">Ảnh đại diện:</label>
                        <input type="file" name="avatar" id="avatar" accept="image/png, image/jpeg">
                    </div>
                </fieldset>

                <!-- Nút Submit & Reset -->
                <div class="button-group">
                    <input type="submit" value="Đăng ký ngay">
                    <input type="reset" value="Nhập lại">
                </div>

            </form>
        </section>
    </main>

</body>
</html>
